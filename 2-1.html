					</textarea>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					在现实世界和日常生活中，大量存在着相等关系和不等关系，例如多与少、大与小、长与短、高与矮、远与近、快与慢、涨与跌、轻与重，不超过或不少于等。类似于这样的问题，反映在数量关系上，就是相等与不等。相等用**等式**表示，不等用**不等式**表示。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					你能用不等式或不等式组表示下列问题中的不等关系吗？

					1. 某段路限速 40km/h
					2. 某品牌酸奶的质量检查规定，酸奶中脂肪的含量 $f$ 应不少于 2.5%，蛋白质含量 $p$ 应不少于 2.3%
					3. 三角形两边之和大于第三边、两边之差小于第三边
					4. 连接直线外一点与直线上各点的所有线段中，垂线段最短
					</textarea>
				</section>

					### **应用**

					</textarea>
				</section>

				<section data-transition="convex">
					<h3><strong>不等式的性质</strong></h3>

					<p style="font-size:0.8em;">由于数轴上的点与实数一一对应，所以可以利用数轴上点的位置关系来规定实数的大小关系：如图，设 $a, b$ 是两个实数，它们在数轴上所对应的点分别是 $A, B$。</p>

					<p style="font-size:0.8em;">当点 $A$ 在点 $B$ 的左边时，$a < b$：</p>

					<svg viewBox="0 0 300 60" width="300" height="60">
						<line x1="15" y1="30" x2="285" y2="30" stroke="#333" stroke-width="2"/>
						<polygon points="285,30 276,24 276,36" fill="#333"/>

						<circle cx="205" cy="30" r="4" fill="#333"/>
						<text x="195" y="52" font-size="16" text-anchor="middle" font-family="serif">B</text>
						<text x="195" y="18" font-size="16" text-anchor="middle" font-family="serif">b</text>
					</svg>

					<p style="font-size:0.8em;">当点 $A$ 在点 $B$ 右边时，$a > b$：</p>

					<svg viewBox="0 0 300 60" width="300" height="60">
						<line x1="15" y1="30" x2="285" y2="30" stroke="#333" stroke-width="2"/>
						<polygon points="285,30 276,24 276,36" fill="#333"/>
						<circle cx="205" cy="30" r="4" fill="#333"/>
						<text x="195" y="52" font-size="16" text-anchor="middle" font-family="serif">A</text>
						<text x="195" y="18" font-size="16" text-anchor="middle" font-family="serif">a</text>
						<circle cx="90" cy="30" r="4" fill="#333"/>
						<text x="80" y="52" font-size="16" text-anchor="middle" font-family="serif">B</text>
						<text x="80" y="18" font-size="16" text-anchor="middle" font-family="serif">b</text>
					</svg>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **不等式的性质**

					关于实数 $a, b$ 大小的比较，有下列基本事实：

					如果 $a - b$ 是正数，那么 $a > b$；
					
					如果 $a - b$ 等于 0，那么 $a = b$；
					
					如果 $a - b$ 是负数，那么 $a < b$。
					
					反过来也对。

				
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **不等式的性质**

					这个基本事实可以表示为：

					$$a > b \Leftrightarrow a - b > 0$$

					$$a = b \Leftrightarrow a - b = 0$$

					$$a < b \Leftrightarrow a - b < 0$$

					要比较两个实数的大小，
					
					可以转化为比较它们的**差与 0 的大小**。
					</textarea>
				</section>

						- $x^2 + y^2 + 1$ 与 $2(x + y - 1)$

					
					</textarea>
				</section>

					### **重要不等式**

					$$\forall a, b \in \mathbb{R},\ a^2 + b^2 \geqslant 2ab \quad (\text{当且仅当 } a = b \text{ 取等号})$$

					<textarea data-template>
					### **重要不等式**

					$$\forall a, b \in \mathbb{R},\ a^2 + b^2 \geqslant 2ab \quad (\text{当且仅当 } a = b \text{ 取等号})$$

					**练习：**

					1. $a^2 + b^2 = 4$，则 $ab$ 最大值是多少？
					2. $\forall x \in \mathbb{R},\ x \neq 0$，$x^2 + \frac{4}{x^2}$ 最小值是多少？
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **回顾总结**

					+ 从实际问题中抽象出不等关系，表示不等式。
					+ 要比较（证明）两个实数的大小，可以转化为比较它们的差与 0 的大小。

					$$a > b \Leftrightarrow a - b > 0$$

					$$a = b \Leftrightarrow a - b = 0$$

					$$a < b \Leftrightarrow a - b < 0$$
					</textarea>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **§2.1.2 等式性质与不等式性质**
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **背景**

					等式有以下基本性质：

					+ 若 $a = b$，则 $b = a$
					+ 若 $a = b, b = c$，则 $a = c$
					+ 若 $a = b$，则 $a + c = b + c$
					+ 若 $a = b$，则 $ac = bc$
					+ 若 $a = b, c \neq 0$，则 $\frac{a}{c} = \frac{b}{c}$
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **不等式的性质**

					思考：类比等式的基本性质，你能猜想不等式的基本性质，并加以证明吗？

					1. **对称性**：$a > b \Leftrightarrow b < a$
					2. **传递性**：若 $a > b, b > c$，则 $a > c$
					3. **可加性**：$a > b \Leftrightarrow a + c > b + c$
					4. **可乘性**：若 $a > b, c > 0$，则 $ac > bc$；若 $a > b, c < 0$，则 $ac < bc$

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **不等式的性质**

					思考：类比等式的基本性质，你能猜想不等式的基本性质，并加以证明吗？

					3. **可加性**：$a > b \Leftrightarrow a + c > b + c$

					由性质 3 可得，
					
					$a + b > c \Leftrightarrow a + b + (-b) > c - b \Leftrightarrow a > c - b$
					
					这表明，不等式中任何一项可以改变符号后移到不等号的另一边。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **不等式的性质**

					思考：类比等式的基本性质，你能猜想不等式的基本性质，并加以证明吗？

					5. **同向可加性**：若 $a > b, c > d$，则 $a + c > b + d$
					6. **同向同正可乘性**：若 $a > b > 0, c > d > 0$，则 $ac > bd$
					7. **同乘方性**：若 $a > b > 0$，则 $a^n > b^n$，$n \in \mathbb{N}^{*}$
					8. **同开方性**：若 $a > b > 0$，则 $\sqrt[n]{a} > \sqrt[n]{b}\ (n \geqslant 2)$

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **例题**

					1. 已知 $a > b > 0, c < 0$，求证 $ac < bc$
					2. 已知 $a > b > 0, c < d < 0$，求证 $\sqrt[3]{ad} < \sqrt[3]{bc}$
					3. 已知 $1 < a < 4$，$2 < b < 8$，求 $a - b$，$ab$ 的取值范围
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **例题**

					4. 已知 $1 \leqslant a - b \leqslant 2$ 且 $2 \leqslant a + b \leqslant 4$，
					求 $4a - 2b$ 的取值范围
					5. 若 $a < 0$ 且 $a \neq b$，试比较 $a$ 与 $2b - \frac{b^2}{a}$ 的大小
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **总结**

					证明不等式的两种思路：

					+ 由已知条件推理出结论，**综合法**
					+ 由结论倒推出所需条件，**分析法**
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **总结**

					1. 用不等式（组）表示不等关系的步骤：

						+ 审清题意，明确条件中的不等关系的个数
						+ 适当设未知数表示变量
						+ 用不等式表示每一个不等关系，并写成不等式组的形式

					
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **总结**


					2. 用不等式表示不等关系的注意点：

						+ 利用不等式表示不等关系时，应注意必须是具有相同性质，可以比较大小的两个量才可用，没有可比性的两个量之间不能用不等式来表示。
						+ 在用不等式表示实际问题时，一定要注意单位统一。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **总结**

					比较两个实数（代数式）大小的步骤：

					+ **作差**：对要比较大小的两个实数（多项式）作差
					+ **变形**：对差进行变形
					+ **判断差的符号**：结合变形的结果及题设条件判断差的符号
					+ **得出结论**
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **总结**

					+ 比较大小的方法（作差法）
					+ 等式和不等式的基本性质
					</textarea>
				</section>
