				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					**请同学们回顾初中所学，什么是命题？**
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					**请同学们回顾初中所学，什么是命题？**

					我们把<font color="red">**可以判断真假** </font> 的陈述句叫做命题。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2" >
					<textarea data-template>
					### **命题**

					我们把**可以判断真假**的陈述句叫做命题。判断为真的命题是真命题，判断为假的命题是假命题。

					中学的数学命题大多可以写成“若 $p$，则 $q$”或者“如果 $p$，那么 $q$”的形式。其中 $p$ 称为命题的**条件**，$q$ 称为命题的**结论**。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2" >
					<textarea data-template>
					### **命题**

					下列命题中，哪些是真命题？哪些是假命题？

					1. 若平行四边形对角线互相垂直，则这个平行四边形是菱形
					2. 若两个三角形的周长相等，则这两个三角形全等
					3. 若 $x^2 - 4x + 3 = 0$，则 $x = 1$
					4. 若平面内两条直线 $a$ 和 $b$ 均垂直于直线 $l$，则 $a \mathop{//}b$
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **充分条件与必要条件**

					一般地，“若 $p$，则 $q$”为真命题，是指由 $p$ 通过推理可以得到 $q$。这时，我们就说，由 $p$ 可以推出 $q$，记作

					$$p \Rightarrow q$$

					并且说，$p$ 是 $q$ 的**充分条件**（sufficient condition），$q$ 是 $p$ 的**必要条件**（necessary condition）。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **充分条件与必要条件**

					如果“若 $p$，则 $q$”为假命题，那么由 $p$ 不可以推出结论 $q$，记作 $$p \nRightarrow q$$ 此时，我们说 $p$ 不是 $q$ 的充分条件，$q$ 不是 $p$ 的必要条件。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3" >
					<textarea data-template>
					### **充分条件与必要条件**

					当我们在使用“充分”与“必要”两个词时，我们在形容什么？

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3" >
					<textarea data-template>
					### **充分条件与必要条件**

					当我们在使用“充分”与“必要”两个词时，我们在形容什么？

					*Sufficient* comes from a Latin verb meaning “to meet the need.” 
					
					当我们说 $p$ 是 $q$ 的充分条件，意思是：若 $p$ 为真，则 $q$ 必定为真。换句话说，不会存在 $p$ 为真而 $q$ 为假的情况。$p$ 为真满足了 $q$ 为真的需要。或者我们知道 $p$ 成立，那么我们可以“充分”认为 $q$ 成立。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3" >
					<textarea data-template>
					### **充分条件与必要条件**

					当我们在使用“充分”与“必要”两个词时，我们在形容什么？


					当我们说 $q$ 是 $p$ 的必要条件，意思是：若 $q$ 为假，则 $p$ 必也不能成立。要想获得 $p$，必先获得 $q$。所以，$q$ 对于 $p$ 成立是必要的。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **判断方法**

					如何判断 $p$ 是否为 $q$ 的充分条件或者必要条件？

					+ 从定义出发，将命题写成“若 $p$，则 $q$”的形式，判断该命题是否为真命题。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **判断方法**

					如何判断 $p$ 是否为 $q$ 的充分条件或者必要条件？

					+ 从定义出发，将命题写成“若 $p$，则 $q$”的形式，判断该命题是否为真命题。
					+ 从集合的角度出发，满足条件 $p$ 构成的集合为 $A$，满足条件 $q$ 构成的集合为 $B$，若 $A \subseteq B$，则 $p \Rightarrow q$ 为真。
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **例题**

					下列“若 $p$，则 $q$”形式的命题，哪些命题中的 $p$ 是 $q$ 的充分条件？

					1. 若四边形的两组对角相等，则这个四边形是平行四边形
					2. 若两个三角形的三边成比例，则这两个三角形相似
					3. 若四边形为菱形，则这个四边形的对角线互相垂直
					4. 若 $x^2 = 1$，则 $x = 1$
					5. 若 $a = b$，则 $ac = bc$
					6. 若 $x, y \in \complement_{\mathbb{R}} \mathbb{Q}$，则 $xy \in \complement_{\mathbb{R}} \mathbb{Q}$
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **判定定理与充分条件**

					“四边形的两组对角相等”是“四边形是平行四边形”的一个充分条件，这样的充分条件是唯一的么？

					当我们说 $p$ 是 $q$ 的充分条件，由 $p$ 可以推出 $q$，但并不意味着只能由这个条件 $p$ 才能推出结论 $q$。一般来说，对给定结论 $q$，使得 $q$ 成立的条件 $p$ **不是唯一**的。

					一般地，数学中每一条**判定定理**都给出了相应数学结论成立的一个**充分条件**。
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **例题**

					下列“若 $p$，则 $q$”形式的命题，哪些命题中的 $q$ 是 $p$ 的必要条件？

					1. 若四边形是平行四边形，则这个四边形的两组对角分别相等
					2. 若这两个三角形相似，则这两个三角形三边成比例
					3. 若四边形的对角线互相垂直，则这个四边形为菱形
					4. 若 $x = 1$，则 $x^2 = 1$
					5. 若 $ac = bc$，则 $a = b$
					6. 若 $xy \in \complement_{\mathbb{R}} \mathbb{Q}$，则 $x, y \in \complement_{\mathbb{R}} \mathbb{Q}$
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **性质定理与必要条件**

					“四边形的两组对角相等”是“四边形是平行四边形”的一个必要条件，这样的必要条件是唯一的么？

					当我们说 $q$ 是 $p$ 的必要条件，由 $p$ 可以推出 $q$，但并不意味着这个条件 $p$ 只能推出结论 $q$。一般来说，对给定条件 $p$，可以推出的结论 $q$ **不是唯一**的。

					一般地，数学中每一条**性质定理**都给出了相应数学结论成立的一个**必要条件**。
					</textarea>
				</section>

					$m, n \in \mathbb{N}^{*}$，条件 $p : m + n > mn$，条件 $q : m = 1$ 或 $n = 1$。问条件 $p$ 是否为条件 $q$ 的充分条件或者必要条件？

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="6">
					<textarea data-template>
					### **思考题**

					$m, n \in \mathbb{N}^{*}$，条件 $p : m + n > mn$，条件 $q : m = 1$ 或 $n = 1$。问条件 $p$ 是否为条件 $q$ 的充分条件或者必要条件？

					**思考：**

					+ 若条件 $p$ 是条件 $q$ 的充分条件，则有 $p \Rightarrow q$。
					+ 若条件 $p$ 是条件 $q$ 的必要条件，则有 $q \Rightarrow p$。

					本质上需要判断命题 $p \Rightarrow q$ 是否为真命题，命题 $q \Rightarrow p$ 是否为真命题？
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="6">
					<textarea data-template>
					### **思考题**

					$m, n \in \mathbb{N}^{*}$，条件 $p : m + n > mn$，条件 $q : m = 1$ 或 $n = 1$。

					**解：**
					若条件 $p$ 是条件 $q$ 的必要条件，则有 $q \Rightarrow p$。因为 $m, n \in \mathbb{N}^{*}$ 且 $m = 1$ 或 $n = 1$，则不妨设 $m = 1$，有 $m + n = 1 + n > 1 \cdot n = mn$。故 $q \Rightarrow p$ 为真命题，条件 $p$ 是条件 $q$ 的必要条件。

					
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="6">
					<textarea data-template>
					### **思考题**

					$m, n \in \mathbb{N}^{*}$，条件 $p : m + n > mn$，条件 $q : m = 1$ 或 $n = 1$。

					**解：**
					若条件 $p$ 是条件 $q$ 的充分条件，则有 $p \Rightarrow q$。

					$$m + n > mn \Leftrightarrow mn - (m + n) < 0 $$ $$ mn - (m + n) + 1 < 1 \Leftrightarrow (m - 1)(n - 1) < 1$$

					
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="6">
					<textarea data-template>
					### **思考题**

					$m, n \in \mathbb{N}^{*}$，条件 $p : m + n > mn$，条件 $q : m = 1$ 或 $n = 1$。

					**解：**
					$m - 1 \in \mathbb{N}$，$n - 1 \in \mathbb{N}$，$(m - 1)(n - 1) \in \mathbb{N}$，$(m - 1)(n - 1) = 0$，$m - 1 = 0$ 或 $n - 1 = 0$。

					故 $m = 1$ 或 $n = 1$，$p \Rightarrow q$ 为真命题，条件 $p$ 是条件 $q$ 的充分条件。
					</textarea>
				</section>

					### **§1.4.2 充分必要条件**
					</textarea>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					+ 原命题：$p \Rightarrow q$
					+ 逆命题：
					
					</textarea>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					+ 原命题：$p \Rightarrow q$
					+ 逆命题：$q \Rightarrow p$
					</textarea>
				</section>

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **思考**

					下列“若 $p$，则 $q$”形式的命题中，哪些命题与它们的逆命题都是真命题？

					1. 若两个三角形的两角和其中一角所对应的边分别相等，则这两个三角形全等。
					2. 若两个三角形全等，则这两个三角形的周长相等。
					3. 若一元二次方程 $ax^2 + bx + c = 0$ 有两个不相等的实数根，则 $ac < 0$。
					4. 若 $A \cup B$ 是空集，则 $A, B = \varnothing$。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **充分必要条件**

					如果“若 $p$，则 $q$”是真命题，它的逆命题“若 $q$，则 $p$”是真命题。即有 $p \Rightarrow q$，$q \Rightarrow p$，就记作：

					$$p \Leftrightarrow q$$

					此时，$p$ 既是 $q$ 的充分条件，也是 $q$ 的必要条件。我们说 $p$ 是 $q$ 的**充分必要条件**，简称为**充要条件**。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **充分必要条件**

					类似的，如果“若 $p$，则 $q$”是真命题，它的逆命题“若 $q$，则 $p$”是假命题。即有 $p \Rightarrow q$，$q \not\Rightarrow p$，

					此时，$p$ 是 $q$ 的<font color="red"> 充分不必要条件</font>，$q$ 是 $p$ 的<font color="red"> 必要不充分条件</font>。

					</textarea>
				</section>

				<section data-markdown data-transition="convex">

					### **例题**

					1. $p$：四边形是正方形，$q$：四边形的对角线互相垂直且平分
					2. $p$：两个三角形相似，$q$：两个三角形三边成比例
					3. $p : xy > 0$，$q : x > 0, y > 0$
					4. $p : x = 1$ 是一元二次方程 $ax^2 + bx + c = 0$ 的一个根，$q : a + b + c = 0\ (a \neq 0)$
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **思考**

					**平行四边形的定义：**

					> 两组对边分别平行的四边形叫做平行四边形

					我们可以根据其他充要条件给出平行四边形的其他定义形式。
