					<textarea data-template>
					### **§1.5.1 全称量词与存在量词**
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					思考下列语句是命题么？
					1. $x > 3$
					2. $2x + 1$ 是整数

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					思考下列语句是命题么？比较 1 和 3，2 和 4，你有什么发现？

					1. $x > 3$
					2. $2x + 1$ 是整数
					3. 对所有的 $x \in \mathbb{R}$，$x > 3$
					4. 对任意一个 $x \in \mathbb{Z}$，$2x + 1$ 是整数

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **背景**

					命题是可以判断真假的陈述句。但是在数学中，会遇到一些含有变量的陈述句，由于不知道变量代表什么数，不能判断真假，因此不是命题。

					但是如果在原语句的基础上，用一个短语对变量的取值范围进行限定，就可以使原语句成为一个命题，我们把这样的短语称为**量词**。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词**

					短语“所有的”“任意一个”在逻辑中通常叫做**全称量词**（universal quantifier），并用符号 $\forall$ 表示，含有全称量词的命题，叫做**全称量词命题**。


					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词**

					短语“所有的”“任意一个”在逻辑中通常叫做**全称量词**（universal quantifier），并用符号 $\forall$ 表示，含有全称量词的命题，叫做**全称量词命题**。

					例如，命题“对任意的 $n \in \mathbb{Z}$，$2n + 1$ 是奇数”，“所有的正方形都是矩形”都是全称量词命题。常见的全称量词还有“一切”、“每一个”、“任给”等。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词**

					通常，将含有变量 $x$ 的语句用 $p(x), q(x), r(x), \cdots$ 表示，变量 $x$ 的取值范围用 $M$ 表示。那么，全称量词命题“对 $M$ 中任意一个 $x$，$p(x)$ 成立”可用符号简记为

					$$\forall x \in M,\ p(x)$$

					$\forall$ 是大写字母 $A$ 的颠倒，单词 *arbitrary* 或者 *all* 的首字母都是 $A$。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3"> 
					<textarea data-template>
					### **全称量词命题**

					**全称量词命题怎么判断真假？**

					要判定全称量词命题“$\forall x \in M, p(x)$”是真命题，需要对集合 $M$ 中的每个元素 $x$，证明 $p(x)$ 成立。

					反之，如果在集合 $M$ 中找到一个元素 $x_0$，使得 $p(x_0)$ 不成立，那么这个全称量词命题就是假命题，这个方法就是**举反例**。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3">
					<textarea data-template>
					### **全称量词命题**

					判断下列全称量词命题的真假：

					1. 所有的素数都是奇数
					2. $\forall x \in \mathbb{R}$，$|x| + 1 \geqslant 1$
					3. 对任意一个无理数 $x$，$x^2$ 也是无理数
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **背景**

					思考下列语句是命题吗？

					1. $2x + 1 = 3$
					2. $x$ 能被 2 和 3 整除
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **背景**

					思考下列语句是命题吗？比较 1 和 3，2 和 4 的关系。

					1. $2x + 1 = 3$
					2. $x$ 能被 2 和 3 整除
					3. 存在一个 $x \in \mathbb{R}$，使得 $2x + 1 = 3$
					4. 至少有一个 $x \in \mathbb{Z}$，使得 $x$ 能被 2 和 3 整除
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="5">
					<textarea data-template>
					### **存在量词**

					短语“存在一个”“至少有一个”在逻辑中通常叫做**存在量词**（existential quantifier），并用符号 $\exists$ 表示。含有存在量词的命题，叫做**存在量词命题**。

					例如，命题“有的平行四边形是菱形”，“有一个素数不是奇数”都是存在量词命题。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="5">
					<textarea data-template>
					### **存在量词**

					存在量词命题“存在 $M$ 中的元素 $x$，$p(x)$ 成立”可用符号简记为

					$$\exists x \in M,\ p(x)$$

					常见的存在量词还有“有些”“有一个”“对某些”“有的”等。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="6">
					<textarea data-template>
					### **存在量词命题**

					**存在量词命题如何判断真假？**

					要判定存在量词命题“$\exists x \in M, p(x)$”是真命题，只需在集合 $M$ 中找到一个元素 $x$，使 $p(x)$ 成立即可；
					
					反之，如果在集合 $M$ 中，使 $p(x)$ 成立的元素 $x$ 不存在，那么这个存在量词命题是假命题。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="6">
					<textarea data-template>
					### **存在量词命题**

					判断下列存在量词命题的真假：

					1. 有一个实数 $x$，使 $x^2 + 2x + 3 = 0$。
					2. 平面内存在两条相交直线垂直于同一条直线。
					3. 有些平行四边形是菱形。
					</textarea>
				</section>

					<textarea data-template>
					### **课堂练习**


					1. 判断真假：$\forall n \in \mathbb{N}^{*}$，$2n^2 + 5n + 2$ 不能被 2 整除是假命题。
					2. 判断真假：$\exists n \in \mathbb{N}^{*}$，$2n^2 + 5n + 2$ 不能被 2 整除是真命题。
					3. 判断真假：$\exists n \in \mathbb{N}^{*}$，$2n^2 + 5n + 2$ 能被 2 整除是假命题。
					
					</textarea>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="7">
					<textarea data-template>
					### **课堂练习**

					4. 用“$\forall, \exists$”改写下列命题：有一个实数乘上任意实数都等于 0。
					5. 设 $A, B$ 为集合，用“$\forall, \exists$”给 $A \subseteq B$，$A \nsubseteq B$ 下定义。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="7">
					<textarea data-template>
					### **课堂练习**

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="7">
					<textarea data-template>
					### **课堂练习**

					(2) 命题：“$\exists x \in A, x \in B$”是真命题，求 $m$ 取值范围。

					
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="7">

					(1) 若命题 $p$ 为真命题，求 $m$ 取值范围。

					(2) 若命题 $p, q$ 至少有一个为真命题，求 $m$ 取值范围。

				<section data-markdown data-transition="convex">
					<textarea data-template>
					### **§1.5.2 全称量词命题和存在量词命题的否定**
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **命题的否定**

					一般地，对一个命题进行否定，就可以得到一个新的命题，这一新命题称为原命题的**否定**。

					原命题为“若 $p$，则 $q$”，
					
					命题的否定为“若 $p$，则 $\neg q$”。

					一个命题和它的否定只能一真一假，不能同真同假。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **命题的否定**


					| 原命题 | 命题的否定 |
					| --- | --- |
					| 56 是 7 的倍数 |  |
					| 空集是非空集合 $A$ 的真子集 |  |
					| 小明月考数学能考 130 分以上 |  |
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="1">
					<textarea data-template>
					### **命题的否定**


					| 原命题 | 命题的否定 |
					| --- | --- |
					| 56 是 7 的倍数 | 56 不是 7 的倍数 |
					| 空集是非空集合 $A$ 的真子集 | 空集不是非空集合 $A$ 的真子集 |
					| 小明月考数学能考 130 分以上 | 小明月考数学不能考 130 分以上 |
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词命题的否定**

					探究：写出下列命题的否定，并分析它们与原命题在形式上有什么变化？

					1. 所有的矩形都是平行四边形
					2. 每一个素数都是奇数
					3. $\forall x \in \mathbb{R}$，$|x| + x \geqslant 0$

					这三个命题都是全称量词命题，即具有“$\forall x \in M, p(x)$”的形式。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词命题的否定**

					这三个命题都是全称量词命题，即具有“$\forall x \in M, p(x)$”的形式。

					命题（1）的否定是“并非所有的矩形都是平行四边形”，也就是说，**存在一个矩形不是平行四边形**。

					命题（2）的否定是“并非每一个素数都是奇数”，也就是说，**存在一个素数不是奇数**。

					命题（3）的否定是“并非所有的 $\forall x \in \mathbb{R}$，$|x| + x \geqslant 0$”，也就是说，$\exists x \in \mathbb{R}$，$|x| + x < 0$。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词命题的否定**

					从命题形式看，这三个全称量词命题的否定都变成了存在量词命题。

					一般来说，对含有一个量词的全称量词命题进行否定，只需把“所有的”“任意一个”等全称量词，变成“并非所有的”“并非任意一个”等短语即可。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词命题的否定**

					也就是说，假定全称量词命题为“$\forall x \in M, p(x)$”，则它的否定为“并非 $\forall x \in M, p(x)$”，
					
					也就是“$\exists x \in M$，$p(x)$ 不成立”。通常，用符号“$\neg p(x)$”表示“$p(x)$ 不成立”。

					全称量词命题：
					$\forall x \in M,\ p(x)$

					它的否定：
					$\exists x \in M,\ \neg p(x)$
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词命题的否定**

					否定全称量词命题的步骤：

					+ **更换量词**：把全称量词变成存在量词
					+ **否定结论**：把全称量词命题的结论否定

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="2">
					<textarea data-template>
					### **全称量词命题的否定**

			
					写出下列全称量词命题的否定：

					1. 所有能被 3 整除的整数都是奇数
					2. 每一个四边形的四个顶点在同一个圆上
					3. 对 $\forall x \in \mathbb{Z}$，$x^2$ 的个位数字不等于 3
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3"  >
					<textarea data-template>
					### **存在量词命题的否定**

					探究：写出下列命题的否定，并分析它们与原命题在形式上有什么变化？

					1. 存在一个实数的绝对值是正数
					2. 有些平行四边形是菱形
					3. $\exists x \in \mathbb{R}$，$x^2 - 2x + 3 = 0$

					这三个命题都是存在量词命题，即具有“$\exists x \in M, p(x)$”的形式。

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="3"  >
					<textarea data-template>
					### **存在量词命题的否定**


					命题（1）的否定是“不存在一个实数，它的绝对值是正数”，也就是说，**所有实数的绝对值都不是正数**。

					命题（2）的否定是“没有一个平行四边形是菱形”，也就是说，**每一个平行四边形都不是菱形**。

					命题（3）的否定是“不存在 $x \in \mathbb{R}$，$x^2 - 2x + 3 = 0$”，也就是说，$\forall x \in \mathbb{R}$，$x^2 - 2x + 3 \neq 0$。
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **存在量词命题的否定**

					从命题形式看，这三个存在量词命题的否定都变成了全称量词命题。

					一般来说，对含有一个量词的存在量词命题进行否定，只需把“存在一个”“至少有一个”“有些”等存在量词，变成“不存在一个”“没有一个”等短语即可。

					
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **存在量词命题的否定**


					也就是说，假定存在量词命题为“$\exists x \in M, p(x)$”，则它的否定为“不存在 $x \in M$，$p(x)$ 成立”，也就是“$\forall x \in M$，$p(x)$ 不成立”。

					存在量词命题：

					$$\exists x \in M,\ p(x)$$

					它的否定：

					$$\forall x \in M,\ \neg p(x)$$
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **存在量词命题的否定**

					否定存在量词命题的步骤：

					+ **更换量词**：把存在量词变成全称量词
					+ **否定结论**：把存在量词命题的结论否定

					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="4">
					<textarea data-template>
					### **存在量词命题的否定**


					写出下列存在量词命题的否定：

					1. $\exists x \in \mathbb{R}$，$x + 2 \leqslant 0$
					2. 有的三角形是等边三角形
					3. 有一个偶数是素数
					</textarea>
				</section>

				<section data-markdown data-transition="convex" data-auto-animate data-auto-animate-id="5">
					<textarea data-template>
					### **课堂练习**

					| 大于 | 小于或等于 |
					| 小于 | 大于或等于 |
					| 是 | 不是 |
					| 都是 | 不都是（和都不是不一样） |
